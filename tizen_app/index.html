<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,user-scalable=no">
<title>Basic</title>
<link rel="stylesheet" href="lib/tau/wearable/theme/default/tau.min.css">
<link rel="stylesheet" media="all and (-tizen-geometric-shape: circle)"
	href="lib/tau/wearable/theme/default/tau.circle.min.css">
<!-- load theme file for your application -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="ui-page ui-page-active" id="first">
		<header class="ui-header">
			<h2 class="ui-title">Game Controller</h2>
		</header>
		<div class="ui-content">
		    <span>Server address:</span>
		    <input id="input-server-address" type="text" value="http://192.168.1.17:5000/api/v1/sensors"/>
			<ul class="ui-listview">
				<li><a id="button-home-play">Play</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-start">Press 'start'</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-select">Press 'select'</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-left">Press 'left'</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-right">Press 'right'</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-up">Press 'up'</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-down">Press 'down'</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-a">Press 'A'</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-b">Press 'B'</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-x">Press 'X'</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-y">Press 'Y'</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-lb">Press 'LB'</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-rb">Press 'RB'</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-lt">Press 'LT'</a></li>
			</ul>
			<ul class="ui-listview">
				<li><a id="button-rt">Press 'RT'</a></li>
			</ul>
		</div>
	</div>
	<script type="text/javascript" src="lib/tau/wearable/js/tau.min.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
